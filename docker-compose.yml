# À déployer sur le NAS (CasaOS : "Installer une application personnalisée" ou `docker compose up -d`)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: rrprospect
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rr -d rrprospect"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://rr:${POSTGRES_PASSWORD}@db:5432/rrprospect
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  # Module 6 : endpoint pixel exposé publiquement via Cloudflare Tunnel (seul /p/* et /c/* seront publics)
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   command: tunnel --no-autoupdate run
  #   environment:
  #     TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}

volumes:
  db_data:
